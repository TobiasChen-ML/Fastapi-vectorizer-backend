<div class="container">
    <main class="main">
        <!-- 这里放原 .card 及其内部所有内容 -->
        <div class="card">
            <h2 class="card-title">位图转矢量额度充值</h2>
            <div class="row">
                <!-- 原充值三卡片，已自动垂直排列 -->
                <div class="pricing-card">
                    <h4>¥9.99</h4><p class="text-muted">20张</p>
                    <button class="recharge-btn" data-amount="9.99" data-credits="20">立即充值</button>
                </div>
                <div class="pricing-card">
                    <h4>¥19.99</h4><p class="text-muted">100张</p>
                    <button class="recharge-btn" data-amount="19.99" data-credits="100">立即充值</button>
                </div>
            </div>
        </div>
    </main>
</div>
<!-- 支付二维码弹窗 -->
<div class="modal fade" id="payModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">微信支付</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <div id="qrcode"></div>
                <p class="mt-3">长按二维码支付</p>
                <p class="text-muted">订单号：<span id="orderNo"></span></p>
            </div>
        </div>
    </div>
</div>

<!-- 引入qrcode.js -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script>
// 创建测试订单
// function createTestOrder() {
//     recharge(1, 1);
// }
window.open_id = "";
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('code');   // 这里就是微信带回的 code
fetch('https://vectorizer.cn/get_openid/', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify({
        code: code
    })
})
.then(response => response.json())
.then(data => {
    window.open_id = data.openid;
})
.catch(error => {
    console.log('error =', error);
});

// 充值函数
function recharge(amount, credits) {
    fetch('https://vectorizer.cn/api/order/make/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            amount: amount,
            credits: credits,
            openid: window.open_id
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.code === 200) {
            // 显示支付二维码
            showPayQRCode(data.data, data.order_no,amount);
            
        } else {
            alert(data.msg || '创建订单失败');
        }
    })
    .catch(error => {
        alert('创建订单失败，请稍后重试');
    });
}

// 自定义金额充值
function rechargeCustom() {
    const amount = document.getElementById('customAmount').value;
    if (amount > 0) {
        recharge(amount, Math.floor(amount));
    } else {
        alert('请输入有效的充值金额');
    }
}

// 显示支付二维码
function showPayQRCode(codeUrl, orderNo, amount) {

    // 显示支付弹窗
    document.getElementById('payModal').style.display = 'block';
    // 更新弹窗内容
    document.getElementById('orderNo').innerHTML = orderNo + ' ' + amount + '元';
    // 清空之前的二维码
    document.getElementById('qrcode').innerHTML = '';
    document.getElementById('qrcode').appendChild(document.createElement('img')).src = codeUrl;
    
    // 开始轮询订单状态
    startPollingOrderStatus(orderNo);
}

// 轮询订单状态
function startPollingOrderStatus(orderNo) {
    const checkOrder = () => {
        fetch(`https://vectorizer.cn/api/order/status/${orderNo}/`, {
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'paid') {
                // 支付成功，关闭弹窗并刷新页面
                document.getElementById('payModal').style.display = 'none';
                alert('充值成功！请回到服务号继续使用。');
            } else if (data.status === 'pending') {
                // 继续轮询
                setTimeout(checkOrder, 3000);
            }
        });
    };
    
    // 开始轮询
    checkOrder();
}

// 为所有充值按钮添加事件监听
document.querySelectorAll('.recharge-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        // 是的,data-amount="49.9" data-credits="1000"这样写是正确的
        // dataset会自动获取data-*属性的值
        const amount = parseFloat(this.dataset.amount);
        const credits = parseInt(this.dataset.credits);
        recharge(amount, credits);
    });
});
</script>
